AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IAM roles required by the Java Symbol Mapper custom agent running on
  Amazon Bedrock AgentCore, registered with AWS Transform.

Resources:

  # -----------------------------------------------------------------------
  # Execution role assumed by the container running on Bedrock AgentCore
  # -----------------------------------------------------------------------
  JavaSymbolMapperExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: java-symbol-mapper-execution-role
      Description: >
        Runtime role for the Java Symbol Mapper agent container on
        Bedrock AgentCore.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
      Policies:
        - PolicyName: JavaSymbolMapperRuntimePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Bedrock model invocation
              - Sid: InvokeBedrockModels
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"

              # AWS Transform agentic service (HITL, job status updates)
              - Sid: TransformAgenticService
                Effect: Allow
                Action:
                  - transformagenticservice:*
                Resource: "*"

              # AWS Transform agent registry (self-registration check)
              - Sid: TransformAgentRegistry
                Effect: Allow
                Action:
                  - atxagentregistryexternal:DescribeAgent
                  - atxagentregistryexternal:ListAgents
                Resource: "*"

              # CloudWatch Logs for agent output
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:log-group:/aws/bedrock/agentcore/*"

  # -----------------------------------------------------------------------
  # Registration role used by the toolkit to register the agent in
  # the AWS Transform registry
  # -----------------------------------------------------------------------
  JavaSymbolMapperRegistrationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: java-symbol-mapper-registration-role
      Description: >
        Role used by the AWS Transform Agent Toolkit (Kiro power) to deploy
        and register the Java Symbol Mapper agent.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: JavaSymbolMapperRegistrationPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ECR: push/pull the agent container image
              - Sid: ECRAccess
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:CreateRepository
                  - ecr:DescribeRepositories
                Resource: "*"

              # Bedrock AgentCore: create/update/delete agent runtime
              - Sid: BedrockAgentCore
                Effect: Allow
                Action:
                  - bedrock:CreateAgentRuntime
                  - bedrock:UpdateAgentRuntime
                  - bedrock:DeleteAgentRuntime
                  - bedrock:GetAgentRuntime
                  - bedrock:ListAgentRuntimes
                Resource: "*"

              # AWS Transform registry: register/update/delete the agent
              - Sid: TransformRegistry
                Effect: Allow
                Action:
                  - atxagentregistryexternal:RegisterAgent
                  - atxagentregistryexternal:UpdateAgent
                  - atxagentregistryexternal:DeregisterAgent
                  - atxagentregistryexternal:DescribeAgent
                  - atxagentregistryexternal:ListAgents
                Resource: "*"

              # IAM PassRole to pass the execution role to AgentCore
              - Sid: PassExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt JavaSymbolMapperExecutionRole.Arn

Outputs:
  ExecutionRoleArn:
    Description: ARN of the execution role for the agent container
    Value: !GetAtt JavaSymbolMapperExecutionRole.Arn
    Export:
      Name: JavaSymbolMapperExecutionRoleArn

  RegistrationRoleArn:
    Description: ARN of the registration role used by the toolkit
    Value: !GetAtt JavaSymbolMapperRegistrationRole.Arn
    Export:
      Name: JavaSymbolMapperRegistrationRoleArn
